apriltag:
  family: DICT_APRILTAG_36h11
  robot_tag_id: 0
  front_edge: top
  corner_refinement: APRILTAG
  error_correction_rate: 0.8
  # Homography 是在地面 z=0 上标定的。车顶 Tag 高于地面时，需要把它
  # 沿相机地面投影方向拉回；球仍按原来的地面 Homography 计算。
  height_correction:
    enabled: true
    camera_height_m: 2.30
    tag_height_m: 0.17
    # 初值：相机在 2.5m 边的中央，位于 y=0 的 x 轴外侧 0.75m。
    # 请用卷尺测量镜头正下方在地面的世界坐标后替换。
    camera_ground_x_m: 1.25
    camera_ground_y_m: -0.75
  # 从底盘控制中心指向 Tag 中心的车体坐标偏移：前为正、左为正。
  # Tag 若正好位于底盘中心上方，两项保持 0。
  tag_offset_forward_m: 0.0
  tag_offset_left_m: 0.0
ball_detection:
  hsv_lower:
  - 29
  - 92
  - 141
  hsv_upper:
  - 41
  - 255
  - 255
  min_area: 34.2
  max_area: 10000.0
  min_circularity: 0.55
  morph_kernel: 5
  restrict_to_field: true
  field_margin_m: 0.02
performance:
  processing_scale: 0.5
  # AprilTag 单独使用原始分辨率，避免远距离/斜视时因缩小导致漏检。
  apriltag_scale: 1.0

ball_tracking:
  enabled: true
  match_distance_m: 0.12
  # 最后位置重新露出白色地面约 1 秒后才确认球已被拿走。
  removal_confirm_frames: 30
  # 球靠近机器人时按“被遮挡”处理，不因暂时看不见而删除。
  robot_occlusion_radius_m: 0.35
  clear_floor_fraction: 0.60
  position_alpha: 0.35
